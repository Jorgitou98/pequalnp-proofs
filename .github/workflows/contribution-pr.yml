name: Manage contribution PRs
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation on open-goat/pequalnp-proofs
        type: choice
        options:
          - create
          - edit-description
          - replace-10905-with-11088
        required: true
      pr_number:
        description: Open PR number (for edit-description)
        type: string
      branch:
        description: Branch in this fork (for create)
        type: string
      title:
        description: PR title (for create)
        type: string
      description:
        description: Contribution details and checks (for create or edit-description)
        type: string

permissions: {}
concurrency: fork-contribution-pr

jobs:
  manage:
    if: github.repository == 'Jorgitou98/pequalnp-proofs' && github.actor == 'Jorgitou98' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Manage upstream PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PNP_GITHUB_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
          DETAILS: ${{ inputs.description }}
          UPSTREAM: open-goat/pequalnp-proofs
        run: |
          set -euo pipefail
          [[ "$(gh api user --jq .login)" == Jorgitou98 ]]
          pulls="repos/$UPSTREAM/pulls"
          if [[ "$OPERATION" == edit-description ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && -n "$DETAILS" ]]
            gh api "$pulls/$PR_NUMBER" | jq -e '
              .user.login == "Jorgitou98" and .head.repo.full_name == "Jorgitou98/pequalnp-proofs"
              and .base.ref == "main" and .state == "open"' > /dev/null
            gh api --method PATCH "$pulls/$PR_NUMBER" -f body="$DETAILS" --jq .html_url
            exit 0
          fi
          if [[ "$OPERATION" == create ]]; then
            [[ -n "$TITLE" && -n "$DETAILS" ]]
            git check-ref-format "refs/heads/$BRANCH"
            existing=$(gh api --method GET "$pulls" -f head="Jorgitou98:$BRANCH" -f base=main -f state=open --jq '.[0].html_url // empty')
            if [[ -n "$existing" ]]; then
              echo "$existing"
              exit 0
            fi
            gh api --method POST "$pulls" -f head="Jorgitou98:$BRANCH" -f base=main -f title="$TITLE" -f body="$DETAILS" --jq .html_url
            exit 0
          fi

          [[ "$OPERATION" == replace-10905-with-11088 ]]
          read_pr() {
            gh api "$pulls/$1" | jq -er --arg ref "$2" '
              select(.user.login == "Jorgitou98" and .head.repo.full_name == "Jorgitou98/pequalnp-proofs"
                and .head.ref == $ref and .base.ref == "main" and .merged == false) | .state'
          }
          old=$(read_pr 10905 reduction/L-meta-4217)
          new=$(read_pr 11088 reduction/L-meta-4217-resubmit)
          keep_corrected_original() {
            local old_sha new_sha
            old_sha=$(gh api "$pulls/10905" --jq .head.sha)
            new_sha=$(gh api "$pulls/11088" --jq .head.sha)
            [[ "$old_sha" == "$new_sha" ]] || return 1
            gh api "$pulls/11088" --jq '{title,body,state:"open"}' |
              gh api --method PATCH "$pulls/10905" --input - --jq '{number,state,title}'
          }
          if [[ "$new" == closed ]]; then
            can_reopen=$(gh api graphql -f query='query { repository(owner:"open-goat",name:"pequalnp-proofs"){pullRequest(number:11088){viewerCanReopen}} }' --jq .data.repository.pullRequest.viewerCanReopen)
            if [[ "$can_reopen" == false ]]; then
              echo "GitHub reports that the authenticated user cannot reopen 11088."
              keep_corrected_original
              exit 0
            fi
          fi
          if [[ "$old" == open ]]; then
            gh api --method PATCH "$pulls/10905" -f state=closed --jq .state
          fi
          if [[ "$new" == closed ]]; then
            if ! gh pr reopen 11088 --repo "$UPSTREAM"; then
              if [[ "$old" == open && "$(read_pr 11088 reduction/L-meta-4217-resubmit)" == closed ]]; then
                keep_corrected_original
              fi
              exit 1
            fi
          fi
          [[ "$(read_pr 10905 reduction/L-meta-4217)" == closed ]]
          [[ "$(read_pr 11088 reduction/L-meta-4217-resubmit)" == open ]]
